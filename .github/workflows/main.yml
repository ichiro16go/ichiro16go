name: Main

on:
  # 毎日 09:00 JST == 00:00 UTC
  schedule:
    - cron: "0 0 * * *"

  # 手動実行
  workflow_dispatch:

# NOTE: push トリガーは外している。
# GitHub-Profile-3D-Contrib が毎日 main へ push するため、
# push を拾うとその都度このジョブが走って Actions 時間を浪費していた。

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      # README が参照している metrics.plugin.isocalendar.fullyear.svg を
      # リポジトリ直下に生成してコミットする。
      # secrets.MY_PERSONAL_ACCESS_TOKEN には read:user / repo スコープの
      # 有効な PAT が必要（期限切れだと "Bad credentials" で失敗する）。
      - name: Isometric commit calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.MY_PERSONAL_ACCESS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
